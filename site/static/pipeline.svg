  <rect class="node" x="408" y="70" width="144" height="72" rx="10"/>
  <rect class="node" x="600" y="70" width="144" height="72" rx="10"/>
  <rect class="node" x="792" y="70" width="144" height="72" rx="10"/>
  <path class="arrow" marker-end="url(#arrow)" d="M168 106H208"/>
  <path class="arrow" marker-end="url(#arrow)" d="M360 106H400"/>
  <path class="arrow" marker-end="url(#arrow)" d="M552 106H592"/>
