<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">The four passes</title>
  <desc id="desc">77 photos flow through nine contact sheets, 21 dedicated reads, 21 face crops, and 16 repeat reads.</desc>
  <style>
